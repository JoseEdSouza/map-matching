[project]
name = "map-matching"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.3"
dependencies = [
    "aiohttp>=3.12.13",
    "cloudpickle>=3.1.1",
    "contextily>=1.6.2",
    "duckdb>=1.3.0",
    "fastexcel>=0.14.0",
    "geopandas>=1.1.0",
    "geopy>=2.4.1",
    "gloe>=0.7.0",
    "gpx>=0.2.1",
    "igraph>=0.11.9",
    "ipykernel>=6.29.5",
    "kagglehub>=0.3.12",
    "matplotlib>=3.10.3",
    "nbformat>=5.10.4",
    "notebook>=7.4.7",
    "numpy>=2.2.6",
    "osmnx>=2.0.6",
    "pandas>=2.2.3",
    "pathos>=0.3.4",
    "plotly>=6.1.2",
    "polars>=1.30.0",
    "polyline>=2.0.2",
    "pyarrow>=20.0.0",
    "pymove>=3.0.0",
    "pyrefly>=0.16.2",
    "requests>=2.32.3",
    "ruff>=0.11.11",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "shapely>=2.1.1",
    "sumolib>=1.24.0",
    "traci>=1.24.0",
    "types-networkx>=3.5.0.20251001",
    "voila>=0.5.8",
    "zstd>=1.5.7.0",
]

[tool.setuptools]
packages = ["mmlib", "mmlib.graphhopper"]

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**/*",
]
