services:
  # ---------------------------------------------------------------------------
  # GraphHopper Routing Engine
  # Provides routing and map matching services using OpenStreetMap data.
  # ---------------------------------------------------------------------------
  graphhopper:
    image: israelhikingmap/graphhopper:latest
    container_name: graphhopper
    ports:
      - "8989:8989"
    environment:
      - JAVA_OPTS=-Xmx4g -Xms4g
      - ACTION=server
      - CONFIG=/config/config.yml
    volumes:
      - ./tools/graphhopper/volumes/graphhopper_data:/data
      - ./tools/graphhopper/config:/config
    entrypoint: ["./graphhopper.sh", "-c", "/config/config.yaml"]
    labels:
      experiment_id: ${EXPERIMENT_ID:-None}
      dataset_id: ${DATASET_ID:-None}
      config: ${CONFIG:-None}
      mode: ${MODE:-offline}
      matcher_name: graphhopper
      mmlib.monitor: "true"

  # ---------------------------------------------------------------------------
  # OSRM Routing Engine
  # Provides routing and map matching services using OpenStreetMap data.
  # ---------------------------------------------------------------------------
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    networks:
      - osrm-net
    ports:
      - "5000:5000"
    volumes:
      - ./tools/osrm/volumes/osrm_data:/data
    command:
      [
        "osrm-routed",
        "--algorithm=mld",
        "--max-matching-size=100000",
        "--max-table-size=100000",
        "/data/network.osrm",
      ]
    labels:
      experiment_id: ${EXPERIMENT_ID:-None}
      dataset_id: ${DATASET_ID:-None}
      config: ${CONFIG:-None}
      mode: ${MODE:-offline}
      matcher_name: osrm
      mmlib.monitor: "true"

  osrm_frontend:
    image: osrm/osrm-frontend
    networks:
      - osrm-net
    ports:
      - "9966:9966"
    environment:
      - OSRM_BACKEND_URL=http://osrm:5000
    depends_on:
      - osrm

  # ---------------------------------------------------------------------------
  # Barefoot
  # Divided into three core components: Map Server, Matcher Server, and Tracker Server.
  # Map Server is a postGIS database with preprocessed map data.
  # Matcher Server performs map matching of GPS traces.
  # Tracker Server performs real-time map matching and state tracking.
  # ---------------------------------------------------------------------------
  barefoot-map:
    image: ghcr.io/joseedsouza/barefoot/barefoot-map:latest
    ports:
      - "5438:5432"
    environment:
      MAP_OSM_PBF_PATH: "/mnt/data/map.osm.pbf"
      POSTGRES_DB: "osm"
      POSTGRES_USER: "osm"
      POSTGRES_PASSWORD: "osm"
      MAP_MODE: "slim"
    volumes:
      # Mount the OSM PBF file (read-only)
      # ! IMPORTANT ! Point to your own OSM PBF file
      - ./networks/pbf/ohare-filtered.osm.pbf:/mnt/data/map.osm.pbf:ro
      # Persistent volumes for map data and database
      - barefoot-map:/mnt/map
      - barefoot-db:/var/lib/postgresql/9.3/main
    healthcheck:
      test: ["CMD-SHELL", "su - postgres -c 'pg_isready'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - barefoot-net

  barefoot-matcher:
    image: ghcr.io/joseedsouza/barefoot/barefoot-matcher:latest
    ports:
      - "1234:1234"
    environment:
      # --- Server Configuration (Optional Overrides) ---
      # SERVER__SERVER_PORT: 1234
      # SERVER__MATCHER_THREADS: 8
      # SERVER__MATCHER_DISTANCE_MAX: 15000
      # SERVER__MATCHER_RADIUS_MAX: 200

      # --- Map Database Configuration ---
      MAP__DATABASE_HOST: barefoot-map
      MAP__DATABASE_PORT: 5432
      MAP__DATABASE_NAME: osm
      MAP__DATABASE_USER: osm
      MAP__DATABASE_PASSWORD: osm
    depends_on:
      barefoot-map:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - barefoot-net
    labels:
      experiment_id: ${EXPERIMENT_ID:-None}
      dataset_id: ${DATASET_ID:-None}
      config: ${CONFIG:-None}
      mode: ${MODE:-offline}
      matcher_name: barefoot_matcher
      mmlib.monitor: "true"

  # ---------------------------------------------------------------------------
  # Barefoot Tracker (online nativo)
  # ---------------------------------------------------------------------------
  barefoot-tracker:
    image: ghcr.io/joseedsouza/barefoot/barefoot-tracker:latest
    ports:
      - "1235:1234" # Tracker API
      - "1236:1235" # Tracker State
    environment:
      # --- Tracker Configuration (Optional Overrides) ---
      # SERVER__SERVER_PORT: 1234
      # SERVER__TRACKER_PORT: 1235
      # SERVER__TRACKER_STATE_TTL: 60

      # --- Map Database Configuration ---
      MAP__DATABASE_HOST: barefoot-map
      MAP__DATABASE_PORT: 5432
      MAP__DATABASE_NAME: osm
      MAP__DATABASE_USER: osm
      MAP__DATABASE_PASSWORD: osm
    depends_on:
      barefoot-map:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - barefoot-net
    labels:
      experiment_id: ${EXPERIMENT_ID:-None}
      dataset_id: ${DATASET_ID:-None}
      config: ${CONFIG:-None}
      mode: ${MODE:-online}
      matcher_name: barefoot_tracker
      mmlib.monitor: "true"

  # ---------------------------------------------------------------------------
  # Graphium
  # ---------------------------------------------------------------------------
  graphium-neo4j:
    image: ghcr.io/joseedsouza/graphium-neo4j:latest
    container_name: mm-graphium-neo4j
    environment:
      - "NEO4J_dbms_memory_heap_max__size=4G"
      - "NEO4J_AUTH=none"
      - "GRAPHIUM_SERVER_NAME=graphium_neo4j"
      - "GRAPHIUM_SERVER_URI=http://localhost:7474/graphium/api"
      - "TZ=UTC"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - graphium-db:/data
      - ./networks/pbf/ohare-filtered.osm.pbf:/networks/network.osm.pbf:ro
    labels:
      experiment_id: ${EXPERIMENT_ID:-None}
      dataset_id: ${DATASET_ID:-None}
      config: ${CONFIG:-None}
      mode: ${MODE:-offline}
      matcher_name: graphium
      mmlib.monitor: "true"

  # ---------------------------------------------------------------------------
  # Monitoring with cAdvisor and Prometheus
  # ---------------------------------------------------------------------------
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/rootfs/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "-housekeeping_interval=1s"
      - "-docker_only=true"
    networks:
      - metrics-net

  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./tools/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - metrics-net

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  barefoot-map:
    driver: local
  barefoot-db:
    driver: local
  graphium-db:
    driver: local
  prometheus-data:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  barefoot-net:
    driver: bridge
  osrm-net:
    driver: bridge
  metrics-net:
    driver: bridge
