services:
  import_osm:
    image: israelhikingmap/graphhopper:latest
    container_name: import_osm
    environment:
      - JAVA_OPTS=-Xmx8g -Xms8g
      - URL=https://download.geofabrik.de/south-america/brazil-latest.osm.pbf
      - ACTION=import
    volumes:
      - ./graphhopper_data:/data
    
